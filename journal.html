<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private Journal — tbm.</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Pridi:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f9f9f7;color:#232625;font-family:"IBM Plex Sans Thai",sans-serif}header{border-bottom:1px solid #deded9;padding:20px max(5vw,24px);display:flex;align-items:center;justify-content:space-between}a{color:inherit;text-decoration:none}.brand{font-weight:600;letter-spacing:.12em}.muted{color:#777e79;font-size:12px;letter-spacing:.1em}.wrap{max-width:850px;margin:auto;padding:70px 24px}h1{font:400 clamp(32px,6vw,56px)/1.35 Pridi,serif;margin:12px 0}p{line-height:1.9}.intro{color:#686d68}.panel{max-width:420px;margin:40px auto;padding:30px;background:white;border:1px solid #e7e7e3;border-radius:16px}input,textarea,select{width:100%;padding:13px;border:1px solid #d9dbd7;border-radius:8px;background:white;font:inherit;margin:6px 0 15px}textarea{min-height:210px;resize:vertical}button{border:0;border-radius:8px;padding:12px 18px;background:#273a31;color:white;font:inherit;cursor:pointer}button.secondary{background:#e8ebe7;color:#273a31}button:disabled{opacity:.5}nav{display:flex;gap:8px;flex-wrap:wrap;margin:30px 0}nav button{background:transparent;color:#5b635d;border:1px solid #d6dad5}.entry{padding:28px 0;border-top:1px solid #deded9}.entry h2{font:400 26px Pridi,serif}.entry .body{font:300 19px/2 Pridi,serif;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:10px;margin-top:16px}.hidden{display:none!important}.status{color:#8a4738;min-height:22px}.empty{padding:40px 0;color:#7d837e}.editor{border-top:1px solid #ddd;padding-top:28px;margin-top:36px}small{color:#737c75}</style></head><body>
<header><a class="brand" href="/">tbm.</a><span class="muted">PRIVATE ARCHIVE / 1996—2026</span></header>
<main class="wrap"><div class="muted">A COLLECTION OF THOUGHTS & MEMORIES</div><h1>ตามที่เอ็งเป็นเอ็งนั่นแหละ</h1><p class="intro">บันทึกชีวิตในวัยสามสิบ · อ่าน ทบทวน และขัดเกลาถ้อยคำตามจังหวะของตัวเอง</p>
<section id="login" class="panel"><div class="muted">PRIVATE ACCESS</div><h2>เข้าสู่บันทึกส่วนตัว</h2><form id="loginForm"><label>อีเมล<input id="email" type="email" required autocomplete="email"></label><label>รหัสผ่าน<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">เข้าสู่ระบบ</button></form><p id="loginStatus" class="status"></p><small>ใช้บัญชี Supabase ที่มีอยู่แล้ว · ไม่มีการเปิดสมัครบัญชีบนหน้านี้</small></section>
<section id="app" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center"><span id="identity" class="muted"></span><button class="secondary" id="logout">ออกจากระบบ</button></div><nav id="filters"></nav><div id="entries"></div><section class="editor"><h2 id="editTitle">เขียนบันทึก</h2><form id="entryForm"><label>ภาค<select id="section"><option value="home">I · บ้านยังไงก็คือบ้าน</option><option value="road">II · ระหว่างทาง</option><option value="friends">III · นานนาน</option><option value="self">IV · ในวันที่ได้รู้จักตัวเอง</option><option value="thirty">V · สามสิบแล้ว แล้วไงต่อ</option><option value="interview">The Interview · 01—25</option><option value="fragments">Fragments</option></select></label><label>ชื่อเรื่อง<input id="title" required maxlength="180"></label><label>เนื้อหา<textarea id="body" required></textarea></label><button type="submit">บันทึกอย่างเป็นส่วนตัว</button> <button type="button" class="secondary" id="cancel">เริ่มเรื่องใหม่</button></form><p id="saveStatus" class="status"></p></section></section>
</main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.81.1';
const sb=createClient('https://emvakfgjwytqnjbdlyls.supabase.co','sb_publishable_j1W5J1xv8IusAL8qh4gQkQ_ZsUB3X-F');
const $=id=>document.getElementById(id);let user=null,records=[],active='all',editing=null;
const sections={home:'I · บ้านยังไงก็คือบ้าน',road:'II · ระหว่างทาง',friends:'III · นานนาน',self:'IV · ในวันที่ได้รู้จักตัวเอง',thirty:'V · สามสิบแล้ว แล้วไงต่อ',interview:'The Interview · 01—25',fragments:'Fragments'};
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function reset(){editing=null;$('entryForm').reset();$('editTitle').textContent='เขียนบันทึก';$('saveStatus').textContent=''}
function render(){const f=$('filters');f.replaceChildren();for(const [key,label] of Object.entries({all:'ทั้งหมด',...sections})){const b=el('button','',label);b.className=key===active?'':'secondary';b.onclick=()=>{active=key;render()};f.append(b)}const list=$('entries');list.replaceChildren();const visible=records.filter(x=>active==='all'||x.section===active);if(!visible.length)list.append(el('p','empty','ยังไม่มีบันทึกในหมวดนี้ — เริ่มเขียนเรื่องแรกได้ด้านล่าง'));for(const r of visible){const article=el('article','entry');article.append(el('small','',sections[r.section]||r.section),el('h2','',r.title),el('div','body',r.body));const actions=el('div','actions'),edit=el('button','secondary','แก้ไข'),del=el('button','secondary','ลบ');edit.onclick=()=>{editing=r.id;$('section').value=r.section;$('title').value=r.title;$('body').value=r.body;$('editTitle').textContent='แก้ไขบันทึก';$('entryForm').scrollIntoView({behavior:'smooth'})};del.onclick=async()=>{if(!confirm('ลบบันทึกนี้อย่างถาวร?'))return;const {error}=await sb.from('tbm_journal_entries').delete().eq('id',r.id).eq('user_id',user.id);if(error)alert(error.message);else await load()};actions.append(edit,del);article.append(actions);list.append(article)}}
async function load(){const {data,error}=await sb.from('tbm_journal_entries').select('id,section,title,body,sort_order,created_at').order('sort_order').order('created_at');if(error){$('entries').textContent='ไม่สามารถโหลดบันทึก: '+error.message;return}records=data||[];render()}
async function sync(){const {data:{user:u}}=await sb.auth.getUser();user=u;$('login').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);if(u){$('identity').textContent=u.email;await load()}else{records=[];reset()}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginStatus').textContent='กำลังเข้าสู่ระบบ…';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';$('loginStatus').textContent=error?error.message:'';if(!error)await sync()};
$('logout').onclick=async()=>{await sb.auth.signOut();await sync()};$('cancel').onclick=reset;
$('entryForm').onsubmit=async e=>{e.preventDefault();if(!user)return;const payload={user_id:user.id,section:$('section').value,title:$('title').value.trim(),body:$('body').value};$('saveStatus').textContent='กำลังบันทึก…';const q=editing?sb.from('tbm_journal_entries').update(payload).eq('id',editing).eq('user_id',user.id):sb.from('tbm_journal_entries').insert(payload);const {error}=await q;$('saveStatus').textContent=error?error.message:'บันทึกแล้ว';if(!error){reset();await load()}};
sb.auth.onAuthStateChange(()=>{setTimeout(sync,0)});sync();
</script></body></html>
